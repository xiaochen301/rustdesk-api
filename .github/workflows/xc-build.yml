# XC: build the customized rustdesk-api (Go + CGO/sqlite) for the XC server
# deployments. Built inside alpine (musl) with CGO enabled: the API links
# mattn/go-sqlite3 which REQUIRES cgo (a CGO_ENABLED=0 build produces a stub
# that only fails at runtime), and the runtime image (s6) is alpine based.
name: xc-build

on:
  workflow_dispatch:
  push:
    branches:
      - 'xc/**'

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build apimain (linux amd64, alpine/musl, CGO)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (alpine, cgo)
        run: |
          docker run --rm -v "$PWD:/src" -w /src golang:alpine sh /src/build-alpine.sh

      - name: Collect artifacts
        run: |
          sha256sum dist/alpine/apimain | tee dist/alpine/SHA256SUMS
          ls -la dist/alpine/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apimain-linux-amd64
          path: dist/alpine/
          if-no-files-found: error
          retention-days: 30
