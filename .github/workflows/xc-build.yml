# XC: build the customized rustdesk-api (Go) for the XC server deployments.
name: xc-build

on:
  workflow_dispatch:
  push:
    branches:
      - 'xc/**'

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build apimain (linux amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build apimain
        run: |
          go mod tidy
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/apimain ./cmd
          sha256sum dist/apimain | tee dist/SHA256SUMS
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apimain-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30
